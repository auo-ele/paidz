name: Auto PaidZ ($USDT) 24/7 - Acc 3 (phanhhyy)

on:
  workflow_dispatch:
  schedule:
    # Lịch chạy đúng 00:00 đêm giờ Việt Nam mỗi ngày (17:00 UTC)
    - cron: '0 17 * * *'

concurrency:
  group: paidz-acc3-run
  cancel-in-progress: true

jobs:
  run-paidz:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install telethon requests colorama; fi

      - name: Chay Auto PaidZ Stealth 24/7 (Acc 3 - phanhhyy)
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
          GITHUB_REPOSITORY: "auo-ele/paidz"
          WORKFLOW_FILE: "paidz_acc3.yml"
          TELEGRAM_API_ID: "34333329"
          TELEGRAM_API_HASH: "4f9371f95000578c84dbc670aaf1f819"
          TELEGRAM_STRING_SESSION: "1BVtsOHIBuxrTG6Dt9a8C_J7D3bm1disV_mQiY_mw7AP5Gp-cEVAlKU1cfvOJiDnU6yi7PInfBRG_wJBQ3uNc-1kOa8fM3ITgUcE7YkaCd77FoBTgIFqw6gMYeRfVJOS1U9S_botQyX5764dx94NBfHHm8HuQKejs0PrdAJQq6WUTDS3mkijWRWIvO4SwXSUrM5yNOFoGIrav8Mbuyl5ZFQaDPg_kwa11NT4kiqov8rVx0virTbGbQudyFeG80kP4zW2CxcuL6TObemIPJgR_2-jb8zVQRQMiI4oN829ZCfHU2JCQY2S2clWwI7onZV8AhYP1LoDBiu32dgQPuk4brS-r1DtkySc="
          GH_PAT: ${{ secrets.GH_PAT }}
          MAX_RUNTIME_SECONDS: "17500"
        run: |
          python auto_paidz.py

      - name: Sync retention state to repository
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add paidz_retention.json || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: persist paidz retention state [skip ci]"
            git push "https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git" HEAD:main || true
          fi
