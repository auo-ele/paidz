name: Telegram Auto Claim

on:
  workflow_dispatch: # Cho phép bấm chạy thủ công bằng tay bất cứ lúc nào
  schedule:
    # Lịch chạy tự động vào 00:05 UTC mỗi ngày (tức là 07:05 sáng giờ Việt Nam)
    # Hoặc nếu bạn muốn đúng 00:00 giờ Việt Nam (UTC+7), hãy chỉnh thành: '0 17 * * *' (17:00 UTC = 00:00 VN)
    - cron: '0 17 * * *'

jobs:
  run-claim:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cài đặt thư viện phụ thuộc
        run: |
          pip install --upgrade pip
          pip install telethon requests colorama

      - name: Chạy script Auto PaidZ
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
        run: |
          python auto_paidz.py
