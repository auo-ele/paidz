name: Auto PaidZ ($USDT) 24/7 - Acc 4 (Wind_trader)

on:
  workflow_dispatch:
  schedule:
    # Lịch chạy đúng 00:00 đêm giờ Việt Nam mỗi ngày (17:00 UTC)
    - cron: '0 17 * * *'

concurrency:
  group: paidz-acc4-run
  cancel-in-progress: true

jobs:
  run-paidz:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install telethon requests colorama; fi

      - name: Chay Auto PaidZ Stealth 24/7 (Acc 4 - Wind_trader)
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
          GITHUB_REPOSITORY: "auo-ele/paidz"
          WORKFLOW_FILE: "paidz_acc4.yml"
          TELEGRAM_API_ID: "34333329"
          TELEGRAM_API_HASH: "4f9371f95000578c84dbc670aaf1f819"
          TELEGRAM_STRING_SESSION: "1BVtsOIIBuzNuH5Jfb4Uwek2dG7YRqSyFk-74KTokth0VB3_UTMwM8Edh_ikn83fJOGyN7JaWzIZXnro3icoY8zsjYIlT5nQ4z_GgKknABQ74FRseCvNbz3yyTkPOfQ4xJfZnJIJHuY4EkzVOzQzYZFg_EJWOj_vvg6OVwSkQv9Nd52tl_SlH4TofoxDXDNvxLJyFcoQFH6BegTybx-pFyX2tz0rMeR7AQujnGxqdWOd4zywoFVShzsCTFeqdsBP9itJvg1YB0ISmJEYXzGEQo37IddAFGw3PJcAIY4BBctxri9_Cw-FbxhMgLU9gsotA3Rrys2jLcGV4CGfOp_IzD0CmtNm845I="
          GH_PAT: ${{ secrets.GH_PAT }}
          MAX_RUNTIME_SECONDS: "17500"
        run: |
          python auto_paidz.py

      - name: Sync retention state to repository
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add paidz_retention.json || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: persist paidz retention state [skip ci]"
            git push "https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git" HEAD:main || true
          fi
