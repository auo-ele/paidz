name: Auto PaidZ ($USDT) 24/7 - Acc 4 (Belinnh2k)

on:
  workflow_dispatch:
  schedule:
    # Chạy mỗi 6 tiếng để duy trì liên tục
    - cron: '0 */6 * * *'

concurrency:
  group: paidz-acc4-run
  cancel-in-progress: true

jobs:
  run-paidz:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install telethon requests colorama; fi

      - name: Chay Auto PaidZ Stealth 24/7 (Acc 4 - Belinnh2k)
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
          GITHUB_REPOSITORY: "auo-ele/paidz"
          WORKFLOW_FILE: "paidz_acc4.yml"
          TELEGRAM_API_ID: "24719662"
          TELEGRAM_API_HASH: "1f6c433e38706fa2e7d77bdfd9a6fdf9"
          TELEGRAM_STRING_SESSION: "1BVtsOMMBu6WXSbH0pQyd4FdW0Fc-zqEWvx3RMUB53LJeKWWB6t61lV-p3TcR3k2psUxcUtbmfdeC1jATK8f7i5jIX_eiplenW3A-h9ALZB7cq9PodKB_KJP4fhOMNeb43G8H7SbF5hDnrdPOiFMEYS1tbjOrmzNu_UyzNe64ndfKb9SSpsTZtrKbo3ryx4x7gpXHrrfISsyMUm6gOjEl9KbyvWCt94yu_spYicw2YsAGCMlKmEYqGIIIpItqZ4VJrdwPtzS__VudhSQzwM56cZMwgTsicw0NA_zaRmgZ4sJEU0ADeMMutBhDtL-kQsJQUb145Ybagpel5xAK86xAKjaeQau5R1I="
          GH_PAT: ${{ secrets.GH_PAT }}
          MAX_RUNTIME_SECONDS: "17500"
        run: |
          python auto_paidz.py

      - name: Sync retention state to repository
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add paidz_retention.json || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: persist paidz retention state [skip ci]"
            git push "https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git" HEAD:main || true
          fi
