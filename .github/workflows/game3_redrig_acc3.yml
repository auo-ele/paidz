name: Game 3 - Auto REDRIG 24/7 (Acc 3 - phanhhyy)

on:
  workflow_dispatch:
  schedule:
    - cron: '35 */6 * * *'

concurrency:
  group: redrig-acc3-run
  cancel-in-progress: true

jobs:
  run-redrig-acc3:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install telethon requests colorama urllib3

      - name: Chay Auto REDRIG Moonpool 24/7 (Acc 3)
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
          GITHUB_REPOSITORY: "auo-ele/paidz"
          WORKFLOW_FILE: "game3_redrig_acc3.yml"
          TELEGRAM_API_ID: "34333329"
          TELEGRAM_API_HASH: "4f9371f95000578c84dbc670aaf1f819"
          GH_PAT: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          MAX_RUNTIME_SECONDS: "17500"
        run: |
          python auto_redrig.py --acc 3 --loop 15

      - name: Tu dong ban giao ca tiep theo (Handover Chaining 24/7)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          echo "Kich hoat ca chay tiep theo cho game3_redrig_acc3.yml..."
          sleep 12
          gh workflow run game3_redrig_acc3.yml --repo "${{ github.repository }}" || echo "Handover triggered."
